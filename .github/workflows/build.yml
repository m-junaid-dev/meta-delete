name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Keystore decode and verify
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v khali ya missing hai. Settings > Secrets and variables > Actions mein banao."
              exit 1
            fi
          done
          # space, line break aur quotes saaf karo
          clean() { printf '%s' "$1" | tr -d ' \r\n\t"'; }
          B64=$(clean "$KEYSTORE_BASE64")
          PW=$(clean "$KEYSTORE_PASSWORD")
          ALIAS=$(clean "$KEY_ALIAS")
          if ! printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/wasaver.jks" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 ki value kharab hai (base64 decode nahi hui). github-secrets.txt ki lambi line poori copy karo."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/wasaver.jks" -storepass "$PW" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore nahi khuli. KEYSTORE_PASSWORD ya KEY_ALIAS galat hai, ya KEYSTORE_BASE64 adhoori copy hui hai."
            exit 1
          fi
          echo "Keystore OK"
          echo "CLEAN_PW=$PW" >> "$GITHUB_ENV"
          echo "CLEAN_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Signed release APK build
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/wasaver.jks
          KEYSTORE_PASSWORD: ${{ env.CLEAN_PW }}
          KEY_ALIAS: ${{ env.CLEAN_ALIAS }}
          KEY_PASSWORD: ${{ env.CLEAN_PW }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK rename
        run: cp app/build/outputs/apk/release/app-release.apk WASaver.apk

      - name: APK upload (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wa-saver-apk
          path: WASaver.apk

      - name: GitHub Release publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WA Saver build ${{ github.run_number }}
          files: WASaver.apk
          make_latest: true
